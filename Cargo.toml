[package]
name = "xavier-cli"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Agent-first CLI for searching X posts via xAI X Search"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeromask1337/xavier"
readme = "README.md"
keywords = ["twitter", "xai", "grok", "search", "cli"]
categories = ["command-line-utilities", "web-programming::http-client"]
exclude = [".github"]

[lib]
name = "xavier"
path = "src/lib.rs"

[[bin]]
name = "xavier"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
